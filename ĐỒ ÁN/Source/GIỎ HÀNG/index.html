<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineGo - Thanh Toán</title>

    <link rel="stylesheet" href="style.css">
    <h1>🎬THANH TOÁN</h1>
    <div class="box">

        <h2>🎟️ Thông Tin Đặt Vé</h2>

        <div class="info-row">
            <span>Tên phim</span>
            <span id="movieName"></span>
        </div>

        <div class="info-row">
            <span>Rạp chiếu</span>
            <span id="cinema"></span>
        </div>

        <div class="info-row">
            <span>Suất chiếu</span>
            <span id="showtime"></span>
        </div>

        <div class="info-row">
            <span>Ghế đã chọn</span>
            <span id="seatList"></span>
        </div>

        <div class="info-row">
            <span>Số lượng vé</span>
            <span id="ticketCount"></span>
        </div>

    </div>

    <div class="box">

        <h2>💳 Phương Thức Thanh Toán</h2>

        <label>
            <input type="radio" name="payment">
            MoMo
        </label>

        <label>
            <input type="radio" name="payment">
            VNPay
        </label>

        <label>
            <input type="radio" name="payment">
            ZaloPay
        </label>

        <label>
            <input type="radio" name="payment">
            Visa / Mastercard
        </label>
        <label>
            <input type="radio" name="payment">
            Thanh toán bằng tiền mặt
        </label>


    </div>

    <div class="box">

        <h2>🧾 Chi Tiết Thanh Toán</h2>

        <div class="row">
            <span>Tiền vé</span>
            <span id="ticketPrice"></span>
        </div>

        <hr>

        <div class="row total">
            <span>Tổng cộng</span>
            <span id="totalPrice"></span>
        </div>

    </div>

    <div class="btn-group">

        <button class="back-btn">
            Quay Lại
        </button>

        <button class="pay-btn" onclick="payTicket()">
            Thanh Toán
        </button>

    </div>

</div>

<script src="payment.js"></script>

</body>
</html>

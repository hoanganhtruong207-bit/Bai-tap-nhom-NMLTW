<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3CrewCine - Quản Lý Rạp Phim</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="brand-side">
        <div class="logo-box">
          <img src="./logo.film.png" alt="3Crew Logo" class="logo-img" />
          <h1 class="brand-name">3Crew<span class="color-br">Cine</span></h1>
        </div>
      </div>

      <div class="form-side">
        <!-- FORM ĐĂNG NHẬP -->
        <form id="loginForm" class="auth-form active" novalidate>
          <div class="input-box">
            <input
              type="text"
              id="loginUser"
              placeholder="Tên người dùng"
              required
            />
            <span class="message" id="loginUserError"
              >This field is required.</span
            >
          </div>

          <div class="input-box">
            <input
              type="password"
              id="loginPass"
              placeholder="Mật khẩu"
              required
            />
            <i
              class="fas fa-eye-slash toggle-password"
              onclick="togglePassword('loginPass', this)"
            ></i>
            <span class="message" id="loginPassError"
              >This field is required.</span
            >
          </div>

          <button type="submit" class="btn-submit btn-login">Đăng nhập</button>

          <div class="social-login">
            <button type="button" class="btn-social btn-google">
              Đăng nhập bằng Google
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
                alt="Google"
                width="16"
              />
            </button>
            <button type="button" class="btn-social btn-facebook">
              Đăng nhập bằng Facebook <i class="fab fa-facebook-f"></i>
            </button>
          </div>

          <div class="form-footer">
            <a href="#" class="forgot-link">Quên mật khẩu</a>
            <a href="#" class="switch-link" onclick="switchForm('register')"
              >Tạo tài khoản mới &rarr;</a
            >
          </div>
        </form>

        <!--FORM ĐĂNG KÝ--> 
        <form id="registerForm" class="auth-form" novalidate>
          <div class="input-box">
            <input
              type="text"
              id="regPhone"
              placeholder="Số điện thoại"
              required
            />
            <span class="message" id="regPhoneError"></span>
          </div>

          <div class="input-box">
            <input type="text" id="regName" placeholder="Họ và tên" required />
            <span class="message" id="regNameError"></span>
          </div>

          <div class="input-box">
            <input
              type="password"
              id="regPass"
              placeholder="Mật khẩu"
              required
            />
            <i
              class="fas fa-eye-slash toggle-password"
              onclick="togglePassword('regPass', this)"
            ></i>
            <span class="message" id="regPassError"></span>
          </div>

          <div class="input-box">
            <input
              type="password"
              id="regConfirmPass"
              placeholder="Nhập lại mật khẩu"
              required
            />
            <i
              class="fas fa-eye-slash toggle-password"
              onclick="togglePassword('regConfirmPass', this)"
            ></i>
            <span class="message" id="regConfirmPassError"></span>
          </div>

          <button type="submit" class="btn-submit btn-register">Đăng ký</button>

          <div class="social-login">
            <button type="button" class="btn-social btn-google">
              Đăng ký bằng Google
              <img
                src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg"
                alt="Google"
                width="16"
              />
            </button>
            <button type="button" class="btn-social btn-facebook">
              Đăng ký bằng Facebook <i class="fab fa-facebook-f"></i>
            </button>
          </div>

          <div class="form-footer">
            <a href="#" class="switch-link" onclick="switchForm('login')"
              >&larr; Đã có tài khoản? Đăng nhập</a
            >
          </div>
        </form>
      </div>
    </div>

    <script src="scriptt.js"></script>
  </body>
</html>
